  <script>
    (() => {
      "use strict";

      const menuBtn = document.getElementById("menuBtn");
      const navLinks = document.getElementById("navLinks");
      const menuIcon = document.getElementById("menuIcon");
      const serviceSelect = document.getElementById("serviceChoice");
      const messageField = document.getElementById("customerMessage");

      const menuOpenMarkup = '<path d="M5 5l14 14M19 5L5 19"/>';
      const menuClosedMarkup = '<path d="M4 6h16M4 12h16M4 18h16"/>';

      function closeMenu() {
        navLinks.classList.remove("open");
        menuBtn.setAttribute("aria-expanded", "false");
        menuBtn.setAttribute("aria-label", "Open navigation menu");
        menuIcon.innerHTML = menuClosedMarkup;
      }

      menuBtn.addEventListener("click", () => {
        const isOpen = navLinks.classList.toggle("open");
        menuBtn.setAttribute("aria-expanded", String(isOpen));
        menuBtn.setAttribute("aria-label", isOpen ? "Close navigation menu" : "Open navigation menu");
        menuIcon.innerHTML = isOpen ? menuOpenMarkup : menuClosedMarkup;
      });

      navLinks.querySelectorAll("a").forEach(link => link.addEventListener("click", closeMenu));

      document.addEventListener("click", event => {
        if (!navLinks.contains(event.target) && !menuBtn.contains(event.target)) closeMenu();
      });

      function selectOption(option) {
        const matchingOption = Array.from(serviceSelect.options).find(item =>
          item.value === option || item.textContent.trim() === option
        );

        if (matchingOption) {
          serviceSelect.value = matchingOption.value;
        } else {
          serviceSelect.value = "Custom Request";
          messageField.value = "I am interested in: " + option;
        }

        document.getElementById("contact").scrollIntoView({ behavior: "smooth", block: "start" });
        window.setTimeout(() => serviceSelect.focus({ preventScroll: true }), 450);
      }

      document.querySelectorAll("[data-select]").forEach(control => {
        control.addEventListener("click", () => selectOption(control.dataset.select));
      });

      window.selectOption = selectOption;
      window.selectService = selectOption;
      window.selectPackage = selectOption;
      window.selectSubscription = selectOption;

      const planTabs = Array.from(document.querySelectorAll(".plan-tab"));
      const planPanels = Array.from(document.querySelectorAll(".plan-panel"));

      function activatePlan(tab, moveFocus = false) {
        const selectedPlan = tab.dataset.plan;
        planTabs.forEach(item => {
          const active = item === tab;
          item.setAttribute("aria-selected", String(active));
          item.tabIndex = active ? 0 : -1;
        });
        planPanels.forEach(panel => {
          panel.hidden = panel.id !== "panel-" + selectedPlan;
        });
        if (moveFocus) tab.focus();
      }

      planTabs.forEach((tab, index) => {
        tab.addEventListener("click", () => activatePlan(tab));
        tab.addEventListener("keydown", event => {
          let nextIndex = index;
          if (event.key === "ArrowRight") nextIndex = (index + 1) % planTabs.length;
          else if (event.key === "ArrowLeft") nextIndex = (index - 1 + planTabs.length) % planTabs.length;
          else if (event.key === "Home") nextIndex = 0;
          else if (event.key === "End") nextIndex = planTabs.length - 1;
          else return;
          event.preventDefault();
          activatePlan(planTabs[nextIndex], true);
        });
      });

      document.getElementById("enquiryForm").addEventListener("submit", event => {
        event.preventDefault();

        const name = document.getElementById("customerName").value.trim();
        const business = document.getElementById("businessName").value.trim();
        const phone = document.getElementById("customerPhone").value.trim();
        const service = serviceSelect.value;
        const message = messageField.value.trim();

        if (!name || !phone || !service) {
          alert("Please complete your name, phone number and service selection.");
          return;
        }

        const lines = [
          "Hello Digital Brand Lift,",
          "",
          "I would like to make an enquiry.",
          "",
          "Name: " + name,
          "Business: " + (business || "Not provided"),
          "Phone: " + phone,
          "Service: " + service,
          "Message: " + (message || "No additional details"),
          "",
          "Please share the next steps."
        ];

        const whatsappURL = "https://wa.me/256732166463?text=" + encodeURIComponent(lines.join("\n"));
        const whatsappWindow = window.open(whatsappURL, "_blank", "noopener");

        if (!whatsappWindow) window.location.href = whatsappURL;
      });

      document.getElementById("year").textContent = new Date().getFullYear();
    })();
  </script>
